<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>FaceAttend — Smart Attendance System</title>
  <link rel="stylesheet" href="styles.css"/>
  <style>
    body { display: flex; align-items: center; justify-content: center; background: var(--bg); overflow: hidden; }
    .splash-container {
      text-align: center; animation: fadeIn 1s ease;
    }
    .scan-ring {
      width: 160px; height: 160px;
      border-radius: 50%; margin: 0 auto 32px;
      position: relative; display: flex; align-items: center; justify-content: center;
    }
    .scan-ring::before, .scan-ring::after {
      content: ''; position: absolute; border-radius: 50%;
      border: 2px solid transparent;
    }
    .scan-ring::before {
      inset: 0; border-top-color: var(--primary); border-right-color: var(--primary);
      animation: spin 1.5s linear infinite;
    }
    .scan-ring::after {
      inset: 14px; border-top-color: #8B5CF6; border-left-color: #8B5CF6;
      animation: spin 2s linear infinite reverse;
    }
    .scan-inner {
      width: 100px; height: 100px; border-radius: 50%;
      background: linear-gradient(135deg, var(--primary), #8B5CF6);
      display: flex; align-items: center; justify-content: center;
      font-size: 44px; box-shadow: 0 0 60px rgba(37,99,235,0.5);
      animation: pulse 2s ease-in-out infinite;
    }
    .app-name { font-size: 48px; font-weight: 800; letter-spacing: -1px; margin-bottom: 8px;
      background: linear-gradient(135deg, var(--primary), #8B5CF6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .app-tagline { font-size: 17px; color: var(--text-2); margin-bottom: 48px; }
    .loading-bar-wrap {
      width: 280px; height: 4px; background: rgba(0,0,0,0.08);
      border-radius: 2px; margin: 0 auto 20px; overflow: hidden;
    }
    .loading-bar {
      height: 100%; width: 0%; border-radius: 2px;
      background: linear-gradient(90deg, var(--primary), #8B5CF6);
      animation: load 2.5s ease forwards;
    }
    .loading-text { font-size: 13px; color: var(--text-3); }
    .dots::after { content: ''; animation: dots 1.5s steps(3) infinite; }
    @keyframes dots { 0%{content:''} 33%{content:'.'} 66%{content:'..'} 100%{content:'...'} }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulse { 0%,100%{box-shadow:0 0 40px rgba(37,99,235,0.4)} 50%{box-shadow:0 0 80px rgba(37,99,235,0.8)} }
    @keyframes load { to { width: 100%; } }
    @keyframes fadeIn { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:none} }
    .version { position: fixed; bottom: 24px; font-size: 12px; color: var(--text-3); }
  </style>
</head>
<body>
  <div class="splash-container">
    <div class="scan-ring">
      <div class="scan-inner">👁️</div>
    </div>
    <div class="app-name">FaceAttend</div>
    <div class="app-tagline">Smart Attendance System Using Face Recognition</div>
    <div class="loading-bar-wrap"><div class="loading-bar"></div></div>
    <div class="loading-text">Initializing system <span class="dots"></span></div>
  </div>
  <div class="version">v1.0.0 — 2026</div>
  <script>
    setTimeout(() => { window.location.href = 'login.html'; }, 3000);
  </script>
</body>
</html>
